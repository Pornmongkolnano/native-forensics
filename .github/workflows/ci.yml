name: Native workbench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Benchmark harness safety regressions
        run: PYTHONPATH=Tests/NativeEngine python3 -m unittest test_benchmark_native_engine test_compare_forensics_pipeline
      - name: Build pinned native engine
        run: python3 script/build_native_engine.py
      - name: Native filesystem regressions
        run: python3 Tests/NativeEngine/run_tests.py --helper .engine/bin/NFTSKEngine --output local/ci-native
      - name: Synthetic correctness tests
        env:
          NFTSK_ENGINE_HELPER: ${{ github.workspace }}/.engine/bin/NFTSKEngine
          NFTSK_SYNTHETIC_FIXTURES: ${{ github.workspace }}/local/ci-native/fixtures
        run: swift test
      - name: Build native app bundle
        run: ./script/build_and_run.sh --build-only
      - name: Optimized correctness tests
        env:
          NFTSK_ENGINE_HELPER: ${{ github.workspace }}/.engine/bin/NFTSKEngine
          NFTSK_SYNTHETIC_FIXTURES: ${{ github.workspace }}/local/ci-native/fixtures
        run: swift test -c release
