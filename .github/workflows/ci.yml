name: Native workbench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Benchmark harness safety regressions
        run: PYTHONPATH=Tests/NativeEngine python3 -m unittest test_benchmark_native_engine test_compare_forensics_pipeline test_benchmark_process_timing test_stage_autopsy_repaired_profile test_app_bundle
      - name: Build pinned native engine
        run: python3 script/build_native_engine.py
      - name: Native filesystem regressions
        run: python3 Tests/NativeEngine/run_tests.py --helper .engine/bin/NFTSKEngine --output local/ci-native
      # Older SwiftPM combines test targets in one process. Native AppKit
      # initialization must not delay the core's real helper/lock deadlines.
      # Each invocation keeps parallel tests within its target; none are skipped.
      # Bound simultaneous helper launches on small runners while retaining
      # cross-suite parallel coverage and the existing process deadlines.
      - name: Synthetic core correctness tests
        env:
          NFTSK_ENGINE_HELPER: ${{ github.workspace }}/.engine/bin/NFTSKEngine
          NFTSK_SYNTHETIC_FIXTURES: ${{ github.workspace }}/local/ci-native/fixtures
        run: swift test --filter ForensicsCoreTests --experimental-maximum-parallelization-width 4
      - name: Native workspace correctness tests
        run: swift test --skip-build --filter NativeForensicsTests
      - name: Cooperative executor blocking regression
        env:
          SWIFT_CONCURRENCY_COOPERATIVE_POOL_STRICT: "1"
        run: swift test --skip-build --filter BlockingWorkTests
      - name: Build native app bundle
        run: ./script/build_and_run.sh --build-only
      - name: Verify packaged app provenance and runtime closure
        run: python3 script/validate_app_bundle.py dist/NativeForensics.app
      - name: Optimized core correctness tests
        env:
          NFTSK_ENGINE_HELPER: ${{ github.workspace }}/.engine/bin/NFTSKEngine
          NFTSK_SYNTHETIC_FIXTURES: ${{ github.workspace }}/local/ci-native/fixtures
        run: swift test -c release --filter ForensicsCoreTests --experimental-maximum-parallelization-width 4
      - name: Optimized native workspace correctness tests
        run: swift test -c release --skip-build --filter NativeForensicsTests
